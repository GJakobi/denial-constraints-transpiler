services:
  postgres:
    image: postgres:16-alpine
    container_name: dc-transpiler-db
    environment:
      POSTGRES_DB: dctest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dctest"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dc_pgdata:
